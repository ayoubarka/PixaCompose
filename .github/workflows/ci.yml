name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS so the iOS targets compile too; the snapshot tests render headlessly.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Desktop snapshot tests and Android build
        run: ./gradlew :showcase:jvmTest :androidApp:assembleDebug
      - name: Compile iOS targets
        run: ./gradlew compileKotlinIosSimulatorArm64 compileKotlinIosArm64
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: showcase/build/snapshots
          if-no-files-found: ignore
